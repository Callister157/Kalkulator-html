<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana (Loop)</title>
</head>
<body>

    <script>
        function jalankanKalkulator() {
            let ulangi = true;

            do {
                // 1. Meminta input angka pertama
                let input1 = prompt("Masukkan angka pertama:");
                if (input1 === null) break; // Keluar dari loop jika tekan Cancel
                let angka1 = parseFloat(input1);

                if (isNaN(angka1)) {
                    alert("Error: Input pertama harus berupa angka!");
                    ulangi = confirm("Apakah Anda ingin mencoba lagi?");
                    continue; // Melompat ke iterasi loop berikutnya
                }

                // 2. Meminta input operator
                let operator = prompt("Masukkan operator (+, -, *, /):");
                if (operator === null) break;
                operator = operator.trim();

                // 3. Meminta input angka kedua
                let input2 = prompt("Masukkan angka kedua:");
                if (input2 === null) break;
                let angka2 = parseFloat(input2);

                if (isNaN(angka2)) {
                    alert("Error: Input kedua harus berupa angka!");
                    ulangi = confirm("Apakah Anda ingin mencoba lagi?");
                    continue;
                }

                // 4. Proses perhitungan
                let hasil;
                let valid = true;

                switch (operator) {
                    case "+":
                        hasil = angka1 + angka2;
                        break;
                    case "-":
                        hasil = angka1 - angka2;
                        break;
                    case "*":
                        hasil = angka1 * angka2;
                        break;
                    case "/":
                        if (angka2 === 0) {
                            alert("Error: Tidak dapat membagi bilangan dengan nol (0)!");
                            valid = false;
                        } else {
                            hasil = angka1 / angka2;
                        }
                        break;
                    default:
                        alert("Error: Operator tidak valid! Gunakan hanya +, -, *, atau /.");
                        valid = false;
                }

                // 5. Menampilkan hasil jika perhitungan valid
                if (valid) {
                    alert("Hasil: " + angka1 + " " + operator + " " + angka2 + " = " + hasil);
                }

                // 6. Konfirmasi apakah pengguna ingin mengulang perhitungan
                ulangi = confirm("Apakah Anda ingin menghitung lagi?");

            } while (ulangi);

            alert("Program kalkulator selesai.");
        }

        jalankanKalkulator();
    </script>

</body>
</html>
